[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmaps-scraper-bro"
version = "1.0.0"
description = "Google Maps scraper driven by the bro stealth browser, with an Apify-compatible input and export"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "bro", email = "support@getbro.ws" }
]
keywords = ["google-maps", "scraper", "browser-automation", "apify", "getbro"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "bro-api-sdk>=0.1.8",
    "pydantic>=2.10.0,<3.0.0",
    "requests>=2.31.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
]

[project.urls]
Homepage = "https://getbro.ws"
Documentation = "https://github.com/jsonifyco/gmaps-scraper/tree/main/docs"
Repository = "https://github.com/jsonifyco/gmaps-scraper"
Issues = "https://github.com/jsonifyco/gmaps-scraper/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
gmaps-scraper = "gmaps_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gmaps_scraper = ["contracts/apify-0.14.761/*.json", "profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"

